name: Auto Android Release

# 推 main 自动出包：编 release + debug，自动打日期 tag 发 Release。
# 更新说明 = 上一个 tag 到本次提交之间的 commits 列表，不另外写日志。
# 日常开发在 preview 分支，合进 main 即发版。
#
# V8 用预编译成品：版本由桥接层 Cargo.lock 钉死，本工作流按版本号去
# 本仓库的 Release 里找 operit2-android-v8-arm64-<版本>.tar.gz。
# 合并上游后若 Cargo.lock 里的 v8 版本变了，必须先跑一次
# "Rebuild Android V8" 工作流把新版本的预编译包传上来，否则这里会
# 明确报错停下——不会悄悄用错版本。
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: auto-android-release-${{ github.ref }}
  cancel-in-progress: true

env:
  RUSTFLAGS: -Awarnings
  RUST_TOOLCHAIN_VERSION: 1.95.0
  FVM_VERSION: 4.3.0

jobs:
  # ── 1. 原生运行时（busybox / proot / bash / loader + alpine rootfs）───────
  # 优先复用已有 artifact（任意一次运行留下的都行），缺了才现编，省约 20 分钟。
  runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Fetch latest runtime artifact
        id: fetch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -u
          api="https://api.github.com/repos/${{ github.repository }}"
          auth="Authorization: Bearer $GH_TOKEN"
          found=""
          page=1
          while [ $page -le 5 ] && [ -z "$found" ]; do
            runs=$(curl -fsSL -H "$auth" -H "Accept: application/vnd.github+json" \
              "$api/actions/runs?per_page=100&page=$page")
            for run_id in $(echo "$runs" | jq -r '.workflow_runs[].id'); do
              [ "$run_id" = "${{ github.run_id }}" ] && continue
              arts=$(curl -fsSL -H "$auth" -H "Accept: application/vnd.github+json" \
                "$api/actions/runs/$run_id/artifacts")
              hit=$(echo "$arts" | jq -r \
                '.artifacts[] | select(.name=="operit2-android-runtime" and .expired==false) | .id' \
                | head -1)
              if [ -n "$hit" ]; then found="$hit"; echo "reusing runtime artifact $hit from run $run_id"; break; fi
            done
            count=$(echo "$runs" | jq '.workflow_runs | length')
            [ "$count" -lt 100 ] && break
            page=$((page+1))
          done
          if [ -n "$found" ]; then
            curl -fsSL -H "$auth" -o /tmp/runtime.zip \
              "$api/actions/artifacts/$found/zip"
            mkdir -p /tmp/runtime-stage
            unzip -q /tmp/runtime.zip -d /tmp/runtime-stage
            jni="apps/flutter/app/android/app/src/main/jniLibs/arm64-v8a"
            assets="apps/flutter/app/android/app/src/main/assets/android-runtime/arm64-v8a"
            mkdir -p "$jni" "$assets"
            for f in libbash.so liboperit_busybox.so liboperit_loader.so liboperit_proot.so; do
              cp "$(find /tmp/runtime-stage -name "$f" | head -1)" "$jni/"
            done
            for f in rootfs.tar.gz.bin rootfs.tar.gz.bin.sha256; do
              cp "$(find /tmp/runtime-stage -name "$f" | head -1)" "$assets/"
            done
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "no live runtime artifact; will build it"
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install build tools
        if: steps.fetch.outputs.found == 'false'
        run: |
          sudo apt-get update
          sudo apt-get install -y bison build-essential bzip2 ca-certificates \
            curl diffutils flex gawk gzip patch pkg-config tar unzip xz-utils

      - name: Fetch Android runtime sources
        if: steps.fetch.outputs.found == 'false'
        shell: pwsh
        run: pwsh -NoProfile -File tools/android-runtime/fetch_sources.ps1

      - name: Fetch Android NDK
        if: steps.fetch.outputs.found == 'false'
        run: bash tools/android-runtime/fetch_ndk_wsl.sh

      - name: Build terminal runtime
        if: steps.fetch.outputs.found == 'false'
        run: |
          export ANDROID_NDK_HOME="$HOME/.cache/operit-android-runtime/android-ndk-r29-beta4"
          bash tools/android-runtime/build_android_tools_wsl.sh
          bash tools/android-runtime/build_alpine_rootfs_wsl.sh

      - name: Upload runtime
        uses: actions/upload-artifact@v4
        with:
          name: operit2-android-runtime
          path: |
            apps/flutter/app/android/app/src/main/jniLibs/arm64-v8a
            apps/flutter/app/android/app/src/main/assets/android-runtime/arm64-v8a
          if-no-files-found: error
          retention-days: 90

  # ── 2. 编译 APK（release + debug）──────────────────────────────────────
  build:
    needs: runtime
    runs-on: windows-2025
    timeout-minutes: 120
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      version_name: ${{ steps.version.outputs.name }}
      version_code: ${{ steps.version.outputs.code }}
    steps:
      - uses: actions/checkout@v4

      - name: Download runtime from this run
        uses: actions/download-artifact@v4
        with:
          name: operit2-android-runtime
          path: apps/flutter/app/android/app/src/main

      - name: Compute release tag
        id: tag
        shell: pwsh
        run: |
          # tag 格式 v年.月.日.时分，按 Asia/Singapore（UTC+8）取时间，
          # 例：v2026.11.1.905（.NET 格式 Hmm = 时无前导零 + 分两位数）
          $tz = [TimeZoneInfo]::FindSystemTimeZoneById('Singapore Standard Time')
          $now = [TimeZoneInfo]::ConvertTimeFromUtc([DateTime]::UtcNow, $tz)
          $tag = 'v' + $now.ToString('yyyy.M.d.Hmm')
          "tag=$tag" >> $env:GITHUB_OUTPUT
          Write-Host "release tag: $tag"

      - name: Install bootstrap Dart
        uses: dart-lang/setup-dart@v1
        with:
          sdk: 3.11.5

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Cache FVM Flutter SDK
        uses: actions/cache@v4
        with:
          path: ~/fvm/versions
          key: fvm-${{ runner.os }}-${{ hashFiles('.fvmrc', 'apps/flutter/app/.fvmrc') }}
          restore-keys: fvm-${{ runner.os }}-

      - name: Install FVM and project Flutter SDK
        shell: pwsh
        working-directory: apps/flutter/app
        run: |
          dart pub global activate fvm $env:FVM_VERSION
          "$env:APPDATA\Pub\Cache\bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          fvm install --skip-pub-get

      - name: Cache Pub packages
        uses: actions/cache@v4
        with:
          path: ~/AppData/Local/Pub/Cache
          key: pub-${{ runner.os }}-${{ hashFiles('apps/flutter/app/pubspec.lock') }}
          restore-keys: pub-${{ runner.os }}-

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('apps/flutter/app/android/**/*.gradle*', 'apps/flutter/app/android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      # gitee.com 的匿名 git 克隆在 CI 上经常断流，这三个插件只在 OHOS
      # 上用到，Android 构建完全不引用，直接摘掉依赖（同手动工作流）。
      - name: Drop OHOS-only gitee dependencies
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $path = 'apps/flutter/app/pubspec.yaml'
          $lines = Get-Content $path
          $out = New-Object System.Collections.Generic.List[string]
          $targets = @('video_player_ohos','path_provider_ohos','url_launcher_ohos')
          $i = 0
          $removed = 0
          while ($i -lt $lines.Count) {
            $line = $lines[$i]
            $name = $line.TrimEnd(':')
            if ($targets -contains $name -and $line.StartsWith('  ') -and -not $line.StartsWith('    ')) {
              $block = @($line)
              $i++
              while ($i -lt $lines.Count -and ($lines[$i].StartsWith('    ') -or $lines[$i].Trim() -eq '')) {
                $block += $lines[$i]
                $i++
              }
              if ($block -match 'gitee\.com') {
                $out.Add("  # removed for CI (gitee clone unreliable): $name")
                $removed++
                continue
              }
              $block | ForEach-Object { $out.Add($_) }
              continue
            }
            $out.Add($line)
            $i++
          }
          if ($removed -gt 0) {
            Set-Content -Path $path -Value $out -Encoding utf8
            Write-Host "removed $removed gitee dependency block(s)"
          } else {
            Write-Host "no gitee dependency blocks present (upstream may have fixed it)"
          }

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN_VERSION }}
          targets: aarch64-linux-android

      - name: Cache Rust (bridge + cargo registry)
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            apps/flutter/native/operit-flutter-bridge -> target
          shared-key: android-arm64

      - name: Prepare Android bindgen libclang
        shell: pwsh
        run: |
          $version = "21.1.8"
          $packageName = "libclang.runtime.win-x64.$version"
          $toolsDir = "target/operit-build-tools"
          $packageDir = Join-Path $toolsDir $packageName
          $archive = Join-Path $toolsDir "$packageName.nupkg"
          New-Item -ItemType Directory -Force -Path $toolsDir | Out-Null
          Invoke-WebRequest -Uri "https://www.nuget.org/api/v2/package/libclang.runtime.win-x64/$version" -OutFile $archive
          Expand-Archive -Path $archive -DestinationPath $packageDir -Force
          if (-not (Test-Path "$packageDir/runtimes/win-x64/native/libclang.dll")) {
            throw "libclang was not prepared"
          }

      - name: Bootstrap plugin build tools
        shell: pwsh
        run: |
          python -m venv .venv
          .\.venv\Scripts\python.exe --version
          corepack enable
          corepack prepare pnpm@10.7.0 --activate
          corepack pnpm --version
          New-Item -ItemType Directory -Force -Path .ci-tools/typescript | Out-Null
          npm install --no-audit --no-fund --prefix .ci-tools/typescript typescript@5.9.2
          npm install --no-audit --no-fund --no-save --no-package-lock esbuild@0.25.10 fflate@0.8.2 typescript@5.9.2

      # ── 预编译 V8 ──────────────────────────────────────────────────────
      # 版本取自桥接层 Cargo.lock；按版本名去本仓库全部 Release 里找
      # operit2-android-v8-arm64-<版本>.tar.gz，找到后解到构建脚本的
      # 缓存目录（manifest 自带逐文件 sha256，prepare_android_v8.py
      # 用时会逐一验，验过就跳过几十分钟的源码编译）。
      # 找不到 = 合并上游时 V8 钉子变了：报错停下，先跑 Rebuild Android V8。
      - name: Fetch prebuilt Android V8
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          $lock = Get-Content 'apps/flutter/native/operit-flutter-bridge/Cargo.lock' -Raw
          $m = [regex]::Match($lock, '(?ms)\[\[package\]\]\s+name\s*=\s*"v8"\s+version\s*=\s*"([^"]+)"')
          if (-not $m.Success) { throw 'cannot find v8 version in bridge Cargo.lock' }
          $ver = $m.Groups[1].Value
          Write-Host "pinned V8 version: $ver"
          $assetName = "operit2-android-v8-arm64-$ver.tar.gz"

          $headers = @{ Authorization = "Bearer $env:GH_TOKEN"; Accept = 'application/vnd.github+json' }
          $api = "https://api.github.com/repos/${{ github.repository }}"
          $releases = Invoke-RestMethod -Headers $headers -Uri "$api/releases?per_page=100"
          $asset = $null
          $sumAsset = $null
          foreach ($rel in $releases) {
            foreach ($a in $rel.assets) {
              if ($a.name -eq $assetName) { $asset = $a }
              if ($a.name -eq "$assetName.sha256") { $sumAsset = $a }
            }
          }
          if (-not $asset) {
            throw "No prebuilt V8 asset '$assetName' in this repo's releases. The Cargo.lock V8 pin ($ver) has no prebuilt package yet - run the 'Rebuild Android V8' workflow once, then re-run this build."
          }
          $tar = Join-Path $env:RUNNER_TEMP $assetName
          Invoke-WebRequest -Headers $headers -OutFile $tar -Uri $asset.url -MaximumRedirection 5
          # asset.url 是 API 地址，需要 Accept 媒体类型才给二进制；改用浏览器下载地址
          if ((Get-Item $tar).Length -lt 1000000) {
            Invoke-WebRequest -Headers @{ Authorization = "Bearer $env:GH_TOKEN"; Accept = 'application/octet-stream' } -OutFile $tar -Uri $asset.url
          }
          if ($sumAsset) {
            Invoke-WebRequest -Headers @{ Authorization = "Bearer $env:GH_TOKEN"; Accept = 'application/octet-stream' } -OutFile "$tar.sha256" -Uri $sumAsset.url
            $expected = ((Get-Content "$tar.sha256" -Raw) -split '\s+')[0].ToLower()
            $actual = (Get-FileHash $tar -Algorithm SHA256).Hash.ToLower()
            if ($expected -ne $actual) { throw "V8 tarball sha256 mismatch: expected $expected, got $actual" }
            Write-Host "V8 tarball sha256 verified: $actual"
          }
          $dest = "tools/release/work/android-v8/$ver/aarch64-linux-android"
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          tar -xzf $tar -C $dest
          Get-ChildItem $dest | ForEach-Object { Write-Host ("v8 cache: " + $_.Name + " (" + $_.Length + " B)") }
          if (-not (Test-Path "$dest/manifest.json")) { throw "V8 tarball missing manifest.json after extract" }

      - name: Restore signing material
        shell: pwsh
        env:
          REL_KEYSTORE_B64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
          REL_STORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_STORE_PASSWORD }}
          REL_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          REL_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
          DBG_KEYSTORE_B64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
          DBG_STORE_PASSWORD: ${{ secrets.ANDROID_DEBUG_STORE_PASSWORD }}
          DBG_KEY_ALIAS: ${{ secrets.ANDROID_DEBUG_KEY_ALIAS }}
          DBG_KEY_PASSWORD: ${{ secrets.ANDROID_DEBUG_KEY_PASSWORD }}
        run: |
          $missing = @()
          foreach ($pair in @(
            @{n='ANDROID_RELEASE_KEYSTORE_BASE64'; v=$env:REL_KEYSTORE_B64},
            @{n='ANDROID_RELEASE_STORE_PASSWORD'; v=$env:REL_STORE_PASSWORD},
            @{n='ANDROID_RELEASE_KEY_ALIAS'; v=$env:REL_KEY_ALIAS},
            @{n='ANDROID_RELEASE_KEY_PASSWORD'; v=$env:REL_KEY_PASSWORD},
            @{n='ANDROID_DEBUG_KEYSTORE_BASE64'; v=$env:DBG_KEYSTORE_B64},
            @{n='ANDROID_DEBUG_STORE_PASSWORD'; v=$env:DBG_STORE_PASSWORD},
            @{n='ANDROID_DEBUG_KEY_ALIAS'; v=$env:DBG_KEY_ALIAS},
            @{n='ANDROID_DEBUG_KEY_PASSWORD'; v=$env:DBG_KEY_PASSWORD})) {
            if ([string]::IsNullOrWhiteSpace($pair.v)) { $missing += $pair.n }
          }
          if ($missing.Count -gt 0) { throw "Missing secrets: $($missing -join ', ')" }

          $dir = "tools/release/secrets"
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          [IO.File]::WriteAllBytes("$dir/operit2-release.keystore", [Convert]::FromBase64String($env:REL_KEYSTORE_B64))
          [IO.File]::WriteAllBytes("$dir/operit2-debug.keystore", [Convert]::FromBase64String($env:DBG_KEYSTORE_B64))

          $localProps = "apps/flutter/app/android/local.properties"
          $list = New-Object System.Collections.Generic.List[string]
          if (Test-Path $localProps) {
            foreach ($line in Get-Content $localProps) {
              if ([string]::IsNullOrWhiteSpace($line)) { continue }
              if ($line -match '^\s*(RELEASE|DEBUG)_(STORE_FILE|STORE_PASSWORD|KEY_ALIAS|KEY_PASSWORD)=') { continue }
              $list.Add($line)
            }
          }
          $relAbs = (Resolve-Path "$dir/operit2-release.keystore").Path.Replace('\', '/')
          $dbgAbs = (Resolve-Path "$dir/operit2-debug.keystore").Path.Replace('\', '/')
          $list.Add("RELEASE_STORE_FILE=$relAbs")
          $list.Add("RELEASE_STORE_PASSWORD=$env:REL_STORE_PASSWORD")
          $list.Add("RELEASE_KEY_ALIAS=$env:REL_KEY_ALIAS")
          $list.Add("RELEASE_KEY_PASSWORD=$env:REL_KEY_PASSWORD")
          $list.Add("DEBUG_STORE_FILE=$dbgAbs")
          $list.Add("DEBUG_STORE_PASSWORD=$env:DBG_STORE_PASSWORD")
          $list.Add("DEBUG_KEY_ALIAS=$env:DBG_KEY_ALIAS")
          $list.Add("DEBUG_KEY_PASSWORD=$env:DBG_KEY_PASSWORD")
          $utf8NoBom = New-Object System.Text.UTF8Encoding($false)
          $localPropsAbs = Join-Path (Resolve-Path -LiteralPath (Split-Path -Parent $localProps)).Path 'local.properties'
          [IO.File]::WriteAllLines($localPropsAbs, $list, $utf8NoBom)
          Write-Host "wrote $localProps"

      - name: Generate Dart proxy artifacts
        shell: pwsh
        env:
          CARGO_BUILD_JOBS: 2
        run: |
          cargo check --manifest-path core/crates/proxy/local/Cargo.toml --quiet
          $files = @(
            'apps/flutter/app/lib/core/proxy/generated/CoreProxyClients.g.dart',
            'apps/flutter/app/lib/core/proxy/generated/CoreProxyModels.g.dart'
          )
          foreach ($f in $files) {
            if (-not (Test-Path $f)) { throw "missing generated artifact: $f" }
          }

      - name: Resolve version
        id: version
        shell: pwsh
        run: |
          $m = Select-String -Path apps/flutter/app/pubspec.yaml -Pattern '^version:\s*(\d+\.\d+\.\d+)\+(\d+)\s*$'
          if ($m.Matches.Count -ne 1) { throw "pubspec.yaml must contain exactly one version line" }
          "name=$($m.Matches[0].Groups[1].Value)" >> $env:GITHUB_OUTPUT
          "code=$($m.Matches[0].Groups[2].Value)" >> $env:GITHUB_OUTPUT

      - name: Build release
        shell: pwsh
        working-directory: apps/flutter/app
        run: |
          fvm flutter build apk --release --split-per-abi --target-platform android-arm64 `
            --build-name ${{ steps.version.outputs.name }} `
            --build-number ${{ steps.version.outputs.code }}

      - name: Build debug
        shell: pwsh
        working-directory: apps/flutter/app
        run: |
          fvm flutter build apk --debug --target-platform android-arm64 `
            --build-name ${{ steps.version.outputs.name }} `
            --build-number ${{ steps.version.outputs.code }}

      - name: Collect APKs
        shell: pwsh
        run: |
          $tag = '${{ steps.tag.outputs.tag }}'
          $ver = '${{ steps.version.outputs.name }}'
          $out = "dist"
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          $src = 'apps/flutter/app/build/app/outputs/flutter-apk'
          $rel = Get-ChildItem -Path $src -Filter 'app-arm64-v8a-release.apk' | Select-Object -First 1
          $dbg = Get-ChildItem -Path $src -Filter 'app-arm64-v8a-debug.apk' | Select-Object -First 1
          if (-not $rel) { throw 'release APK not found' }
          if (-not $dbg) { throw 'debug APK not found' }
          $relName = "operit2-app-android-arm64-v8a-$ver-$tag.apk"
          $dbgName = "operit2-app-android-arm64-v8a-$ver-$tag-debug.apk"
          Copy-Item $rel.FullName (Join-Path $out $relName) -Force
          Copy-Item $dbg.FullName (Join-Path $out $dbgName) -Force
          foreach ($n in @($relName, $dbgName)) {
            $p = Join-Path $out $n
            $hash = (Get-FileHash $p -Algorithm SHA256).Hash.ToLower()
            "$hash  $n" | Out-File -FilePath "$out/SHA256SUMS.txt" -Append -Encoding utf8
            Write-Host "built $n ($([math]::Round((Get-Item $p).Length/1MB,1)) MiB) sha256=$hash"
          }

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: operit2-apk-${{ steps.tag.outputs.tag }}
          path: dist/**
          if-no-files-found: error
          retention-days: 14

  # ── 3. 打 tag 发 Release ───────────────────────────────────────────────
  # 更新说明 = 上一个 tag..本次提交 的 commits 列表（仓库定的规矩）。
  release:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download APKs
        uses: actions/download-artifact@v4
        with:
          name: operit2-apk-${{ needs.build.outputs.tag }}
          path: dist

      - name: Create tag and release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.build.outputs.tag }}
          VER_NAME: ${{ needs.build.outputs.version_name }}
          VER_CODE: ${{ needs.build.outputs.version_code }}
        run: |
          set -eu
          sha="${{ github.sha }}"
          prev=$(git describe --tags --abbrev=0 "$sha^" 2>/dev/null || echo "")
          if [ -n "$prev" ]; then range="$prev..$sha"; else range="$sha"; fi
          {
            echo "Operit2 Android $VER_NAME+$VER_CODE"
            echo ""
            if [ -n "$prev" ]; then echo "上一个 tag：$prev"; echo ""; fi
            echo "## 更新内容（commits）"
            echo ""
            git log $range --pretty=format:'- %s (`%h`)'
            echo ""
          } > /tmp/notes.md
          echo "---- release notes ----"
          cat /tmp/notes.md
          gh release create "$TAG" \
            --target "$sha" \
            --title "$TAG" \
            --notes-file /tmp/notes.md \
            dist/*.apk dist/SHA256SUMS.txt
          echo "released $TAG at $sha"
