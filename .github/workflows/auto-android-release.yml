name: Auto Android Release

# 推 main 自动出包：编 release + debug，自动打日期 tag 发 Release。
# 更新说明 = 上一个 tag 到本次提交之间的 commits 列表，不另外写日志。
# 日常开发在 preview 分支，合进 main 即发版。
#
# 手动触发（workflow_dispatch）：默认只编 release（求快）；需要 debug 包时
# 勾选 build_debug。push 触发（合 main 发版）保持 release + debug 全套。
#
# 构建机从 windows-2025 换成 ubuntu-24.04：私有仓 Windows 分钟按 2 倍计费，
# Linux 1 倍；且本地已验证的构建环境就是 Ubuntu，脚本按 Linux 原生写的。
# 提速点：FVM/Pub/Gradle/Rust 桥 target/NDK 全部走 actions/cache，
# 原生运行时复用已有 artifact，V8 用预编译成品。
#
# V8 用预编译成品：版本由桥接层 Cargo.lock 钉死，本工作流按版本号去
# 本仓库的 Release 里找 operit2-android-v8-arm64-<版本>.tar.gz。
# 合并上游后若 Cargo.lock 里的 v8 版本变了，必须先跑一次
# "Rebuild Android V8" 工作流把新版本的预编译包传上来，否则这里会
# 明确报错停下——不会悄悄用错版本。
on:
  push:
    branches: [main, test/actions-release-linux]
  workflow_dispatch:
    inputs:
      build_debug:
        description: "同时编 debug 包（默认只编 release）"
        type: boolean
        default: false

permissions:
  contents: write
  actions: read

concurrency:
  group: auto-android-release-${{ github.ref }}
  cancel-in-progress: true

env:
  RUSTFLAGS: -Awarnings
  RUST_TOOLCHAIN_VERSION: 1.95.0
  FVM_VERSION: 4.3.0
  # 私有仓标准 runner 资源有限，Rust 并行开太高会 OOM
  CARGO_BUILD_JOBS: "2"

jobs:
  # ── 1. 原生运行时（busybox / proot / bash / loader + alpine rootfs）───────
  # 优先复用已有 artifact（任意一次运行留下的都行），缺了才现编，省约 20 分钟。
  runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Fetch latest runtime artifact
        id: fetch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -u
          api="https://api.github.com/repos/${{ github.repository }}"
          auth="Authorization: Bearer $GH_TOKEN"
          found=""
          page=1
          while [ $page -le 5 ] && [ -z "$found" ]; do
            runs=$(curl -fsSL -H "$auth" -H "Accept: application/vnd.github+json" \
              "$api/actions/runs?per_page=100&page=$page")
            for run_id in $(echo "$runs" | jq -r '.workflow_runs[].id'); do
              [ "$run_id" = "${{ github.run_id }}" ] && continue
              arts=$(curl -fsSL -H "$auth" -H "Accept: application/vnd.github+json" \
                "$api/actions/runs/$run_id/artifacts")
              hit=$(echo "$arts" | jq -r \
                '.artifacts[] | select(.name=="operit2-android-runtime" and .expired==false) | .id' \
                | head -1)
              if [ -n "$hit" ]; then found="$hit"; echo "reusing runtime artifact $hit from run $run_id"; break; fi
            done
            count=$(echo "$runs" | jq '.workflow_runs | length')
            [ "$count" -lt 100 ] && break
            page=$((page+1))
          done
          if [ -n "$found" ]; then
            curl -fsSL -H "$auth" -o /tmp/runtime.zip \
              "$api/actions/artifacts/$found/zip"
            mkdir -p /tmp/runtime-stage
            unzip -q /tmp/runtime.zip -d /tmp/runtime-stage
            jni="apps/flutter/app/android/app/src/main/jniLibs/arm64-v8a"
            assets="apps/flutter/app/android/app/src/main/assets/android-runtime/arm64-v8a"
            mkdir -p "$jni" "$assets"
            for f in libbash.so liboperit_busybox.so liboperit_loader.so liboperit_proot.so; do
              cp "$(find /tmp/runtime-stage -name "$f" | head -1)" "$jni/"
            done
            for f in rootfs.tar.gz.bin rootfs.tar.gz.bin.sha256; do
              cp "$(find /tmp/runtime-stage -name "$f" | head -1)" "$assets/"
            done
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "no live runtime artifact; will build it"
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install build tools
        if: steps.fetch.outputs.found == 'false'
        run: |
          sudo apt-get update
          sudo apt-get install -y bison build-essential bzip2 ca-certificates \
            curl diffutils flex gawk gzip patch pkg-config tar unzip xz-utils

      - name: Fetch Android runtime sources
        if: steps.fetch.outputs.found == 'false'
        shell: pwsh
        run: pwsh -NoProfile -File tools/android-runtime/fetch_sources.ps1

      - name: Fetch Android NDK
        if: steps.fetch.outputs.found == 'false'
        run: bash tools/android-runtime/fetch_ndk_wsl.sh

      - name: Build terminal runtime
        if: steps.fetch.outputs.found == 'false'
        run: |
          export ANDROID_NDK_HOME="$HOME/.cache/operit-android-runtime/android-ndk-r29-beta4"
          bash tools/android-runtime/build_android_tools_wsl.sh
          bash tools/android-runtime/build_alpine_rootfs_wsl.sh

      - name: Upload runtime
        uses: actions/upload-artifact@v4
        with:
          name: operit2-android-runtime
          path: |
            apps/flutter/app/android/app/src/main/jniLibs/arm64-v8a
            apps/flutter/app/android/app/src/main/assets/android-runtime/arm64-v8a
          if-no-files-found: error
          retention-days: 90

  # ── 2. 编译 APK（release 必编；debug 仅 push 发版或手动勾选时编）─────────
  build:
    needs: runtime
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      version_name: ${{ steps.version.outputs.name }}
      version_code: ${{ steps.version.outputs.code }}
    steps:
      - uses: actions/checkout@v4

      - name: Download runtime from this run
        uses: actions/download-artifact@v4
        with:
          name: operit2-android-runtime
          path: apps/flutter/app/android/app/src/main

      - name: Plan build variants
        id: plan
        run: |
          if { [ "${{ github.event_name }}" = "push" ] && [ "${{ github.ref_name }}" = "main" ]; } || [ "${{ inputs.build_debug }}" = "true" ]; then
            echo "build_debug=true" >> "$GITHUB_OUTPUT"
            echo "variants: release + debug"
          else
            echo "build_debug=false" >> "$GITHUB_OUTPUT"
            echo "variants: release only"
          fi

      - name: Compute release tag
        id: tag
        run: |
          # tag 格式 v年.月.日.时分，按 Asia/Singapore（UTC+8）取时间，
          # 例：v2026.11.1.905（时无前导零 + 分两位数）
          tag="v$(TZ=Asia/Singapore date +'%Y.%-m.%-d.%-H%M')"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "release tag: $tag"

      - name: Install bootstrap Dart
        uses: dart-lang/setup-dart@v1
        with:
          sdk: 3.11.5

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Cache FVM Flutter SDK
        uses: actions/cache@v4
        with:
          path: ~/fvm/versions
          key: fvm-${{ runner.os }}-${{ hashFiles('.fvmrc', 'apps/flutter/app/.fvmrc') }}
          restore-keys: fvm-${{ runner.os }}-

      - name: Install FVM and project Flutter SDK
        working-directory: apps/flutter/app
        run: |
          dart pub global activate fvm "$FVM_VERSION"
          echo "$HOME/.pub-cache/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.pub-cache/bin:$PATH"
          fvm install --skip-pub-get

      - name: Cache Pub packages
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('apps/flutter/app/pubspec.lock') }}
          restore-keys: pub-${{ runner.os }}-

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('apps/flutter/app/android/**/*.gradle*', 'apps/flutter/app/android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      # Flutter SDK 钉住的 NDK 版本 + Gradle 写死的 cmake 3.22.1：runner 镜像
      # 不一定带齐，缺了 AGP 会每次现下几 GB。解析出版本号后走 cache，
      # 只有 cache 未命中才用 sdkmanager 装。
      - name: Resolve Flutter-pinned NDK version
        id: ndk
        run: |
          fver=$(jq -r .flutter .fvmrc)
          sdk="$HOME/fvm/versions/$fver"
          # Flutter 工具的真实默认写在 Kotlin 源码里（ndkVersion: String = "…"）；
          # 退而求其次才找等号写法。范围只限 flutter_tools/gradle，
          # 整个 flutter_tools 里有测试夹具的旧版本号，会误命中。
          ver=$(grep -rhoE 'ndkVersion:\s*String\s*=\s*"[0-9][0-9.]*"' "$sdk/packages/flutter_tools/gradle" 2>/dev/null \
            | grep -oE '[0-9][0-9.]*' | head -1)
          if [ -z "$ver" ]; then
            ver=$(grep -rhoE 'ndkVersion\s*=\s*"[0-9][0-9.]*"' "$sdk/packages/flutter_tools/gradle" 2>/dev/null \
              | grep -oE '[0-9][0-9.]*' | head -1)
          fi
          echo "version=$ver" >> "$GITHUB_OUTPUT"
          echo "flutter-pinned NDK: '${ver:-unknown (AGP will auto-download)}'"

      - name: Cache Android NDK
        if: steps.ndk.outputs.version != ''
        uses: actions/cache@v4
        with:
          path: ${{ env.ANDROID_HOME }}/ndk/${{ steps.ndk.outputs.version }}
          key: ndk-${{ runner.os }}-${{ steps.ndk.outputs.version }}

      - name: Provision Android NDK and CMake
        run: |
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          ver="${{ steps.ndk.outputs.version }}"
          if [ -n "$ver" ] && [ ! -d "$ANDROID_HOME/ndk/$ver" ]; then
            yes | "$sdkmanager" "ndk;$ver" > /dev/null
            echo "installed ndk;$ver"
          fi
          if [ ! -d "$ANDROID_HOME/cmake/3.22.1" ]; then
            yes | "$sdkmanager" "cmake;3.22.1" > /dev/null
            echo "installed cmake;3.22.1"
          fi

      # gitee.com 的匿名 git 克隆在 CI 上经常断流，这三个插件只在 OHOS
      # 上用到，Android 构建完全不引用，直接摘掉依赖（同手动工作流）。
      - name: Drop OHOS-only gitee dependencies
        run: |
          python3 - <<'PYEOF'
          path = 'apps/flutter/app/pubspec.yaml'
          lines = open(path, encoding='utf-8').read().splitlines(keepends=True)
          targets = {'video_player_ohos', 'path_provider_ohos', 'url_launcher_ohos'}
          out = []
          i = 0
          removed = 0
          while i < len(lines):
              line = lines[i]
              name = line.strip().rstrip(':')
              if name in targets and line.startswith('  ') and not line.startswith('    '):
                  block = [line]
                  i += 1
                  while i < len(lines) and (lines[i].startswith('    ') or lines[i].strip() == ''):
                      block.append(lines[i])
                      i += 1
                  if any('gitee.com' in b for b in block):
                      out.append(f"  # removed for CI (gitee clone unreliable): {name}\n")
                      removed += 1
                      continue
                  out.extend(block)
                  continue
              out.append(line)
              i += 1
          if removed > 0:
              open(path, 'w', encoding='utf-8').write(''.join(out))
          print(f"removed {removed} gitee dependency block(s)")
          PYEOF

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN_VERSION }}
          targets: aarch64-linux-android

      - name: Cache Rust (bridge + cargo registry)
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            apps/flutter/native/operit-flutter-bridge -> target
          shared-key: android-arm64-linux

      # bindgen 用的 libclang：与 Windows 版同版本（21.1.8）的 linux-x64
      # NuGet 包，解出后用 OPERIT_LIBCLANG_DIR 指过去（Gradle 脚本认这个
      # 环境变量，优先于默认路径；有契约测试锁着这个行为）。
      - name: Prepare Android bindgen libclang
        run: |
          version="21.1.8"
          pkg="libclang.runtime.linux-x64.$version"
          tools_dir="target/operit-build-tools"
          mkdir -p "$tools_dir"
          curl -fsSL -o "$tools_dir/$pkg.nupkg" \
            "https://www.nuget.org/api/v2/package/libclang.runtime.linux-x64/$version"
          unzip -q -o "$tools_dir/$pkg.nupkg" -d "$tools_dir/$pkg"
          native="$PWD/$tools_dir/$pkg/runtimes/linux-x64/native"
          if [ ! -f "$native/libclang.so" ]; then
            echo "libclang was not prepared" >&2
            exit 1
          fi
          echo "OPERIT_LIBCLANG_DIR=$native" >> "$GITHUB_ENV"
          echo "libclang ready at $native"

      - name: Cache CI bootstrap tools
        uses: actions/cache@v4
        with:
          path: |
            .ci-tools
            node_modules
          key: ci-tools-v1-${{ runner.os }}

      - name: Bootstrap plugin build tools
        run: |
          python3 -m venv .venv
          .venv/bin/python --version
          corepack enable
          corepack prepare pnpm@10.7.0 --activate
          corepack pnpm --version
          mkdir -p .ci-tools/typescript
          npm install --no-audit --no-fund --prefix .ci-tools/typescript typescript@5.9.2
          npm install --no-audit --no-fund --no-save --no-package-lock esbuild@0.25.10 fflate@0.8.2 typescript@5.9.2

      # ── 预编译 V8 ──────────────────────────────────────────────────────
      # 版本取自桥接层 Cargo.lock；按版本名去本仓库全部 Release 里找
      # operit2-android-v8-arm64-<版本>.tar.gz，找到后解到构建脚本的
      # 缓存目录（manifest 自带逐文件 sha256，prepare_android_v8.py
      # 用时会逐一验，验过就跳过几十分钟的源码编译）。
      # 找不到 = 合并上游时 V8 钉子变了：报错停下，先跑 Rebuild Android V8。
      - name: Fetch prebuilt Android V8
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          ver=$(grep -A2 'name = "v8"' apps/flutter/native/operit-flutter-bridge/Cargo.lock \
            | grep -oE 'version = "[^"]+"' | head -1 | cut -d'"' -f2)
          if [ -z "$ver" ]; then echo "cannot find v8 version in bridge Cargo.lock" >&2; exit 1; fi
          echo "pinned V8 version: $ver"
          asset_name="operit2-android-v8-arm64-$ver.tar.gz"
          api="https://api.github.com/repos/${{ github.repository }}"
          auth="Authorization: Bearer $GH_TOKEN"
          releases=$(curl -fsSL -H "$auth" -H "Accept: application/vnd.github+json" \
            "$api/releases?per_page=100")
          asset_id=$(echo "$releases" | jq -r --arg n "$asset_name" \
            '.[].assets[] | select(.name==$n) | .id' | head -1)
          if [ -z "$asset_id" ]; then
            echo "No prebuilt V8 asset '$asset_name' in this repo's releases. The Cargo.lock V8 pin ($ver) has no prebuilt package yet - run the 'Rebuild Android V8' workflow once, then re-run this build." >&2
            exit 1
          fi
          tar_path="$RUNNER_TEMP/$asset_name"
          curl -fsSL -H "$auth" -H "Accept: application/octet-stream" \
            -o "$tar_path" "$api/releases/assets/$asset_id"
          sum_id=$(echo "$releases" | jq -r --arg n "$asset_name.sha256" \
            '.[].assets[] | select(.name==$n) | .id' | head -1)
          if [ -n "$sum_id" ]; then
            curl -fsSL -H "$auth" -H "Accept: application/octet-stream" \
              -o "$tar_path.sha256" "$api/releases/assets/$sum_id"
            expected=$(cut -d' ' -f1 "$tar_path.sha256" | tr 'A-F' 'a-f')
            actual=$(sha256sum "$tar_path" | cut -d' ' -f1)
            if [ "$expected" != "$actual" ]; then
              echo "V8 tarball sha256 mismatch: expected $expected, got $actual" >&2
              exit 1
            fi
            echo "V8 tarball sha256 verified: $actual"
          fi
          dest="tools/release/work/android-v8/$ver/aarch64-linux-android"
          mkdir -p "$dest"
          tar -xzf "$tar_path" -C "$dest"
          ls -la "$dest"
          if [ ! -f "$dest/manifest.json" ]; then
            echo "V8 tarball missing manifest.json after extract" >&2
            exit 1
          fi

      - name: Restore signing material
        env:
          REL_KEYSTORE_B64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
          REL_STORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_STORE_PASSWORD }}
          REL_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          REL_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
          DBG_KEYSTORE_B64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
          DBG_STORE_PASSWORD: ${{ secrets.ANDROID_DEBUG_STORE_PASSWORD }}
          DBG_KEY_ALIAS: ${{ secrets.ANDROID_DEBUG_KEY_ALIAS }}
          DBG_KEY_PASSWORD: ${{ secrets.ANDROID_DEBUG_KEY_PASSWORD }}
        run: |
          set -eu
          missing=""
          for pair in \
            "ANDROID_RELEASE_KEYSTORE_BASE64:$REL_KEYSTORE_B64" \
            "ANDROID_RELEASE_STORE_PASSWORD:$REL_STORE_PASSWORD" \
            "ANDROID_RELEASE_KEY_ALIAS:$REL_KEY_ALIAS" \
            "ANDROID_RELEASE_KEY_PASSWORD:$REL_KEY_PASSWORD" \
            "ANDROID_DEBUG_KEYSTORE_BASE64:$DBG_KEYSTORE_B64" \
            "ANDROID_DEBUG_STORE_PASSWORD:$DBG_STORE_PASSWORD" \
            "ANDROID_DEBUG_KEY_ALIAS:$DBG_KEY_ALIAS" \
            "ANDROID_DEBUG_KEY_PASSWORD:$DBG_KEY_PASSWORD"; do
            if [ -z "${pair#*:}" ]; then missing="$missing ${pair%%:*}"; fi
          done
          if [ -n "$missing" ]; then echo "Missing secrets:$missing" >&2; exit 1; fi

          dir="tools/release/secrets"
          mkdir -p "$dir"
          echo "$REL_KEYSTORE_B64" | base64 -d > "$dir/operit2-release.keystore"
          echo "$DBG_KEYSTORE_B64" | base64 -d > "$dir/operit2-debug.keystore"

          props="apps/flutter/app/android/local.properties"
          tmp="$(mktemp)"
          if [ -f "$props" ]; then
            grep -vE '^\s*(RELEASE|DEBUG)_(STORE_FILE|STORE_PASSWORD|KEY_ALIAS|KEY_PASSWORD)=' "$props" \
              | grep -v '^[[:space:]]*$' > "$tmp" || true
          fi
          rel_abs="$(readlink -f "$dir/operit2-release.keystore")"
          dbg_abs="$(readlink -f "$dir/operit2-debug.keystore")"
          {
            cat "$tmp"
            echo "RELEASE_STORE_FILE=$rel_abs"
            echo "RELEASE_STORE_PASSWORD=$REL_STORE_PASSWORD"
            echo "RELEASE_KEY_ALIAS=$REL_KEY_ALIAS"
            echo "RELEASE_KEY_PASSWORD=$REL_KEY_PASSWORD"
            echo "DEBUG_STORE_FILE=$dbg_abs"
            echo "DEBUG_STORE_PASSWORD=$DBG_STORE_PASSWORD"
            echo "DEBUG_KEY_ALIAS=$DBG_KEY_ALIAS"
            echo "DEBUG_KEY_PASSWORD=$DBG_KEY_PASSWORD"
          } > "$props"
          echo "wrote $props"

      - name: Generate Dart proxy artifacts
        run: |
          cargo check --manifest-path core/crates/proxy/local/Cargo.toml --quiet
          for f in \
            apps/flutter/app/lib/core/proxy/generated/CoreProxyClients.g.dart \
            apps/flutter/app/lib/core/proxy/generated/CoreProxyModels.g.dart; do
            if [ ! -f "$f" ]; then echo "missing generated artifact: $f" >&2; exit 1; fi
          done

      - name: Resolve version
        id: version
        run: |
          line=$(grep -E '^version:[[:space:]]*[0-9]+\.[0-9]+\.[0-9]+\+[0-9]+[[:space:]]*$' apps/flutter/app/pubspec.yaml)
          name=$(echo "$line" | sed -E 's/^version:[[:space:]]*([0-9.]+)\+[0-9]+.*/\1/')
          code=$(echo "$line" | sed -E 's/^version:[[:space:]]*[0-9.]+\+([0-9]+).*/\1/')
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "version: $name+$code"

      - name: Build release
        working-directory: apps/flutter/app
        run: |
          export PATH="$HOME/.pub-cache/bin:$PATH"
          fvm flutter build apk --release --split-per-abi --target-platform android-arm64 \
            --build-name "${{ steps.version.outputs.name }}" \
            --build-number "${{ steps.version.outputs.code }}"

      - name: Build debug
        if: steps.plan.outputs.build_debug == 'true'
        working-directory: apps/flutter/app
        run: |
          export PATH="$HOME/.pub-cache/bin:$PATH"
          fvm flutter build apk --debug --split-per-abi --target-platform android-arm64 \
            --build-name "${{ steps.version.outputs.name }}" \
            --build-number "${{ steps.version.outputs.code }}"

      - name: Collect APKs
        run: |
          set -eu
          tag="${{ steps.tag.outputs.tag }}"
          ver="${{ steps.version.outputs.name }}"
          out="dist"
          mkdir -p "$out"
          src="apps/flutter/app/build/app/outputs/flutter-apk"
          rel=$(find "$src" -name 'app-arm64-v8a-release.apk' | head -1)
          if [ -z "$rel" ]; then echo "release APK not found" >&2; exit 1; fi
          rel_name="operit2-app-android-arm64-v8a-$ver-$tag.apk"
          cp "$rel" "$out/$rel_name"
          names="$rel_name"
          if [ "${{ steps.plan.outputs.build_debug }}" = "true" ]; then
            dbg=$(find "$src" -name 'app-arm64-v8a-debug.apk' | head -1)
            if [ -z "$dbg" ]; then echo "debug APK not found" >&2; exit 1; fi
            dbg_name="operit2-app-android-arm64-v8a-$ver-$tag-debug.apk"
            cp "$dbg" "$out/$dbg_name"
            names="$names $dbg_name"
          fi
          : > "$out/SHA256SUMS.txt"
          for n in $names; do
            hash=$(sha256sum "$out/$n" | cut -d' ' -f1)
            echo "$hash  $n" >> "$out/SHA256SUMS.txt"
            size=$(du -h "$out/$n" | cut -f1)
            echo "built $n ($size) sha256=$hash"
          done

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: operit2-apk-${{ steps.tag.outputs.tag }}
          path: dist/**
          if-no-files-found: error
          retention-days: 14

  # ── 3. 打 tag 发 Release ───────────────────────────────────────────────
  # 更新说明 = 上一个 tag..本次提交 的 commits 列表（仓库定的规矩）。
  release:
    needs: build
    # 只在 main 上正式打 tag 发版；测试分支只编包存 artifact，不污染版本历史
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download APKs
        uses: actions/download-artifact@v4
        with:
          name: operit2-apk-${{ needs.build.outputs.tag }}
          path: dist

      - name: Create tag and release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.build.outputs.tag }}
          VER_NAME: ${{ needs.build.outputs.version_name }}
          VER_CODE: ${{ needs.build.outputs.version_code }}
        run: |
          set -eu
          sha="${{ github.sha }}"
          prev=$(git describe --tags --abbrev=0 "$sha^" 2>/dev/null || echo "")
          if [ -n "$prev" ]; then range="$prev..$sha"; else range="$sha"; fi
          {
            echo "Operit2 Android $VER_NAME+$VER_CODE"
            echo ""
            if [ -n "$prev" ]; then echo "上一个 tag：$prev"; echo ""; fi
            echo "## 更新内容（commits）"
            echo ""
            git log $range --pretty=format:'- %s (`%h`)'
            echo ""
          } > /tmp/notes.md
          echo "---- release notes ----"
          cat /tmp/notes.md
          gh release create "$TAG" \
            --target "$sha" \
            --title "$TAG" \
            --notes-file /tmp/notes.md \
            dist/*.apk dist/SHA256SUMS.txt
          echo "released $TAG at $sha"
